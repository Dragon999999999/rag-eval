[project]
name = "rag-eval"
version = "0.1.0"
description = "Infrastructure foundation for reproducible RAG evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "rag-eval contributors" }]
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "boto3>=1.35",
    "duckdb>=1.1",
    "httpx>=0.28",
    "pyarrow>=18.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "tenacity>=9.0",
    "typer>=0.15",
]

[project.scripts]
rag-eval = "rag_eval.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires external infrastructure and is not run by default.",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
docstring-code-format = true
