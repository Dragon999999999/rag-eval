services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: ${RAG_EVAL_POSTGRES_DATABASE:-rag_eval}
      POSTGRES_USER: ${RAG_EVAL_POSTGRES_USER:-rag_eval}
      POSTGRES_PASSWORD: ${RAG_EVAL_POSTGRES_PASSWORD:-rag_eval}
    ports:
      - "${RAG_EVAL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${RAG_EVAL_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${RAG_EVAL_S3_SECRET_KEY:-minioadmin}
    ports:
      - "${RAG_EVAL_S3_PORT:-9002}:9000"
      - "${RAG_EVAL_MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: amazon/aws-cli:2.22.35
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RAG_EVAL_S3_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${RAG_EVAL_S3_SECRET_KEY:-minioadmin}
      AWS_DEFAULT_REGION: ${RAG_EVAL_S3_REGION:-us-east-1}
      RAG_EVAL_S3_BUCKET: ${RAG_EVAL_S3_BUCKET:-rag-eval-artifacts}
    entrypoint: >-
      /bin/sh -c "if ! aws --endpoint-url http://minio:9000 s3api head-bucket
      --bucket $$RAG_EVAL_S3_BUCKET; then aws --endpoint-url http://minio:9000
      s3api create-bucket --bucket $$RAG_EVAL_S3_BUCKET; fi"
    restart: "no"

volumes:
  postgres_data:
  minio_data:
